[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "word-mcp-server"
version = "1.0.0"
description = "Model Context Protocol (MCP) Server for Microsoft Word automation and document processing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AI Automation Team" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "microsoft-word",
    "word",
    "docx",
    "automation",
    "office",
    "pywin32",
    "python-docx"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "mcp>=1.0.0",
    "python-docx>=1.1.0",
    "pywin32>=306; sys_platform == 'win32'",
    "lxml>=4.9.0",
    "pillow>=10.0.0"
]

[project.scripts]
word-mcp = "word_mcp_server:main"

[tool.setuptools]
py-modules = ["word_mcp_server", "word_engine"]
