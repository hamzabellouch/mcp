[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-mcp-server"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for Blender 3D real-time control, procedural modeling, and rendering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity MCP Team" }
]
keywords = ["blender", "mcp", "model-context-protocol", "ai", "3d", "llm", "bpy", "procedural-generation", "rendering"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
blender-mcp = "blender_mcp_server:main"

[project.urls]
Homepage = "https://github.com/your-username/blender-mcp"
Repository = "https://github.com/your-username/blender-mcp.git"
Issues = "https://github.com/your-username/blender-mcp/issues"
