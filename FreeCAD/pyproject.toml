[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-mcp"
version = "0.1.25"
description = "Model Context Protocol (MCP) server for FreeCAD parametric 3D CAD modeling, TechDraw, FEM simulation, and automation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "FreeCAD MCP Contributors" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "freecad",
    "cad",
    "3d-modeling",
    "parametric",
    "fem",
    "techdraw",
    "ai",
    "llm",
    "opencascade"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
freecad-mcp = "freecad_mcp_server:main"

[project.urls]
Homepage = "https://github.com/freecad/freecad-mcp"
Repository = "https://github.com/freecad/freecad-mcp"
Issues = "https://github.com/freecad/freecad-mcp/issues"
Documentation = "https://github.com/freecad/freecad-mcp/blob/main/README.md"

[tool.setuptools]
py-modules = [
    "freecad_mcp_server"
]
